name: powerto-backend

services:
  postgres:
    image: docker.io/postgis/postgis:18-3.6
    environment:
      # docker-postgis installs extensions into POSTGRES_DB automatically. Use
      # an image bootstrap database, then create the Atlas-owned database clean.
      POSTGRES_DB: powerto_image_bootstrap
      POSTGRES_PASSWORD: ${POWERTO_POSTGRES_PASSWORD:-powerto-local-only}
      POSTGRES_USER: powerto
    ports:
      - "127.0.0.1:${POWERTO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/20_create_clean_database.sql:/docker-entrypoint-initdb.d/20_create_clean_database.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U powerto -d powerto
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    restart: unless-stopped

volumes:
  postgres-data:
