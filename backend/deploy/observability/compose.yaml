name: powerto-observability

services:
  victoria-metrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.147.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=7d
      - -opentelemetry.usePrometheusNaming=true
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    ports:
      - "127.0.0.1:${POWERTO_VICTORIA_METRICS_PORT:-8428}:8428"
    healthcheck:
      test:
        - CMD
        - /usr/bin/wget
        - -q
        - --spider
        - http://127.0.0.1:8428/-/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:v1.52.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=7d
    volumes:
      - victoria-logs-data:/victoria-logs-data
    ports:
      - "127.0.0.1:${POWERTO_VICTORIA_LOGS_PORT:-9428}:9428"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  victoria-traces:
    image: docker.io/victoriametrics/victoria-traces:v0.9.4
    command:
      - -storageDataPath=/victoria-traces-data
      - -retentionPeriod=7d
    volumes:
      - victoria-traces-data:/victoria-traces-data
    ports:
      - "127.0.0.1:${POWERTO_VICTORIA_TRACES_PORT:-10428}:10428"
    healthcheck:
      test:
        - CMD
        - /usr/bin/wget
        - -q
        - --spider
        - http://127.0.0.1:10428/-/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0
    command:
      - --config=/etc/otelcol-contrib/collector.yaml
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/collector.yaml:ro
    ports:
      - "127.0.0.1:${POWERTO_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${POWERTO_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${POWERTO_OTEL_HEALTH_PORT:-13133}:13133"
    mem_limit: 512m
    depends_on:
      victoria-metrics:
        condition: service_healthy
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  # VictoriaLogs and the Collector use distroless images with no shell, so an
  # external check verifies all four HTTP readiness endpoints when requested.
  stack-ready:
    profiles:
      - check
    image: docker.io/victoriametrics/victoria-metrics:v1.147.0
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        for url in \
          http://victoria-metrics:8428/-/ready \
          http://victoria-logs:9428/-/ready \
          http://victoria-traces:10428/-/ready \
          http://otel-collector:13133/
        do
          until wget -q --spider "$${url}"; do
            sleep 1
          done
        done
        echo "observability stack ready"
    depends_on:
      victoria-metrics:
        condition: service_started
      victoria-logs:
        condition: service_started
      victoria-traces:
        condition: service_started
      otel-collector:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  victoria-metrics-data:
  victoria-logs-data:
  victoria-traces-data:
